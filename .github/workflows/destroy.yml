name: "CI/CD: Destroy"
on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      target_folder:
        description: Stack
        required: true
        default: 'infra/serverless'
        type: choice
        options:
          - infra/serverless
          - infra/db
          - infra/network
          - infra/bootstrap
          - infra/portal
      confirmation:
        description: Type yes to destroy
        required: true
        default: 'no'

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.17.0"

jobs:
  confirm:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        env:
          CONF: ${{ inputs.confirmation }}
        run: |
          if [ "$CONF" != "yes" ]; then
            echo "Confirmation must be exactly: yes"
            exit 1
          fi

  approve:
    name: Approve
    needs: confirm
    uses: ./.github/workflows/reusable-approve.yml
    with:
      env_name: ${{ inputs.env_name }}
    concurrency:
      group: tf-${{ inputs.target_folder }}-${{ inputs.env_name }}
      cancel-in-progress: false

  destroy:
    name: Destroy
    needs: approve
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-${{ inputs.target_folder }}-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Set Folder
        id: env
        run: |
          echo "folder=$([ "${{ inputs.env_name }}" = "production" ] && echo "prod" || echo "dev")" >> "$GITHUB_OUTPUT"
      - name: Terraform Init
        run: terraform init -backend-config="config/${{ steps.env.outputs.folder }}/config.remote"
        working-directory: ${{ inputs.target_folder }}
      - name: Terraform Destroy
        env:
          TARGET: ${{ inputs.target_folder }}
          FOLDER: ${{ steps.env.outputs.folder }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ inputs.target_folder }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "infra/portal" ]; then
            export TF_VAR_cloudflare_api_token="$CLOUDFLARE_API_TOKEN"
            export TF_VAR_cloudflare_account_id="$CLOUDFLARE_ACCOUNT_ID"
          fi
          ARGS=(-var-file="config/$FOLDER/config.tfvars" -auto-approve -no-color -input=false)
          if [ "$TARGET" = "infra/serverless" ]; then
            ARGS+=(-var="image_tag=destroy")
          fi
          terraform destroy "${ARGS[@]}"
