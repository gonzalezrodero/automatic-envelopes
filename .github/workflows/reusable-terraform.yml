name: "Template: Terraform Plan & Apply"

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      tf_folder:
        required: true
        type: string
      working_dir:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.11.4"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-${{ inputs.working_dir }}-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform Init
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: terraform init -backend-config=config/$TF_FOLDER/config.remote
        working-directory: ${{ inputs.working_dir }}
      - name: Prepare database provider
        if: inputs.working_dir == 'infra/db'
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        working-directory: ${{ inputs.working_dir }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          name=$(sed -n 's/^project_name *= *"\(.*\)".*/\1/p' "config/${TF_FOLDER}/config.tfvars")
          arn=$(aws rds describe-db-instances --db-instance-identifier "${name}-db" --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
          raw=$(aws secretsmanager get-secret-value --secret-id "$arn" --query SecretString --output text)
          echo "::add-mask::$raw"
          password=$(printf '%s' "$raw" | jq -r .password)
          echo "::add-mask::$password"
          {
            echo "TF_VAR_db_master_password<<EOF"
            echo "$password"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Terraform Plan
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: |
          terraform plan \
            -var-file=config/$TF_FOLDER/config.tfvars \
            -out=tfplan \
            -no-color
        working-directory: ${{ inputs.working_dir }}
      - name: Upload Terraform plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ inputs.tf_folder }}-${{ inputs.env_name }}-${{ github.run_id }}
          path: ${{ inputs.working_dir }}/tfplan
          if-no-files-found: error
          retention-days: 5

  approve:
    name: Approve
    needs: plan
    uses: ./.github/workflows/reusable-approve.yml
    with:
      env_name: ${{ inputs.env_name }}
    permissions:
      contents: read
    concurrency:
      group: tf-${{ inputs.working_dir }}-${{ inputs.env_name }}
      cancel-in-progress: false

  apply:
    name: Apply
    needs: approve
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-${{ inputs.working_dir }}-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Download Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-${{ inputs.tf_folder }}-${{ inputs.env_name }}-${{ github.run_id }}
          path: ${{ inputs.working_dir }}
      - name: Terraform Init
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: terraform init -backend-config=config/$TF_FOLDER/config.remote
        working-directory: ${{ inputs.working_dir }}
      - name: Prepare database provider
        if: inputs.working_dir == 'infra/db'
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        working-directory: ${{ inputs.working_dir }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          name=$(sed -n 's/^project_name *= *"\(.*\)".*/\1/p' "config/${TF_FOLDER}/config.tfvars")
          arn=$(aws rds describe-db-instances --db-instance-identifier "${name}-db" --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
          raw=$(aws secretsmanager get-secret-value --secret-id "$arn" --query SecretString --output text)
          echo "::add-mask::$raw"
          password=$(printf '%s' "$raw" | jq -r .password)
          echo "::add-mask::$password"
          {
            echo "TF_VAR_db_master_password<<EOF"
            echo "$password"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan
        working-directory: ${{ inputs.working_dir }}
