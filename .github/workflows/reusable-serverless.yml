name: "Template: Build, Plan & Apply Serverless"

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      tf_folder:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: automatic-envelopes-api
  TF_WORKING_DIR: 'infra/serverless'
  TF_VERSION: "1.11.4"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-infra/serverless-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.calver.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: calver
        run: echo "tag=$(date +'%Y.%m.%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: terraform init -backend-config=config/$TF_FOLDER/config.remote
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Ensure ECR exists in AWS + state before planning so apply can push the
      # image then apply the saved plan without a -target apply or stale plan.
      - name: Ensure ECR repository
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Creating ECR repository $ECR_REPOSITORY"
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=KMS \
              --region "$AWS_REGION"
          else
            echo "ECR repository $ECR_REPOSITORY already exists"
          fi

          if ! terraform state show aws_ecr_repository.backend >/dev/null 2>&1; then
            echo "Importing aws_ecr_repository.backend into Terraform state"
            terraform import \
              -var-file="config/$TF_FOLDER/config.tfvars" \
              -var="image_tag=import" \
              aws_ecr_repository.backend "$ECR_REPOSITORY"
          else
            echo "aws_ecr_repository.backend already in state"
          fi

      - name: Terraform Plan
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          terraform plan \
            -var-file=config/$TF_FOLDER/config.tfvars \
            -var="image_tag=$TAG" \
            -out=tfplan \
            -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Terraform plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-serverless-${{ inputs.tf_folder }}-${{ inputs.env_name }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 5

  approve:
    name: Approve
    needs: plan
    uses: ./.github/workflows/reusable-approve.yml
    with:
      env_name: ${{ inputs.env_name }}
    permissions:
      contents: read
    concurrency:
      group: tf-infra/serverless-${{ inputs.env_name }}
      cancel-in-progress: false

  apply:
    name: Apply
    needs: approve
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-infra/serverless-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: login-ecr

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-serverless-${{ inputs.tf_folder }}-${{ inputs.env_name }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: terraform init -backend-config=config/$TF_FOLDER/config.remote
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
