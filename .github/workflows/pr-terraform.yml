name: "CI/CD: Pull request plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/bootstrap/**"
      - "infra/network/**"
      - "infra/db/**"
      - "infra/serverless/**"
      - "infra/modules/**"
      - "infra/portal/**"
      - ".github/workflows/pr-terraform.yml"
      - ".github/workflows/reusable-portal.yml"
      - ".github/workflows/reusable-terraform.yml"
      - ".github/workflows/reusable-serverless.yml"

# Same-repo PRs only (OIDC + secrets). Forks are skipped.
permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.17.0"
  ECR_REPOSITORY: automatic-envelopes-api
  # Pull requests plan only dev. There is no prod plan job.
  # The role is created by dev bootstrap; plans fail until that apply exists.
  PLAN_ROLE_ARN: arn:aws:iam::543704476214:role/automatic-envelopes-github-plan-role

jobs:
  changes:
    name: Detect stacks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      stacks: ${{ steps.matrix.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bootstrap:
              - 'infra/bootstrap/**'
            network:
              - 'infra/network/**'
            db:
              - 'infra/db/**'
            serverless:
              - 'infra/serverless/**'
              - 'infra/modules/**'
            portal:
              - 'infra/portal/**'

      # Build matrix in the changes job — job-level `if:` cannot reference matrix.
      - name: Build plan matrix
        id: matrix
        run: |
          stacks=()
          if [ "${{ steps.filter.outputs.bootstrap }}" = "true" ]; then
            stacks+=("bootstrap")
          fi
          if [ "${{ steps.filter.outputs.network }}" = "true" ]; then
            stacks+=("network")
          fi
          if [ "${{ steps.filter.outputs.db }}" = "true" ]; then
            stacks+=("db")
          fi
          if [ "${{ steps.filter.outputs.serverless }}" = "true" ]; then
            stacks+=("serverless")
          fi
          if [ "${{ steps.filter.outputs.portal }}" = "true" ]; then
            stacks+=("portal")
          fi
          if [ ${#stacks[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "stacks=[]" >> "$GITHUB_OUTPUT"
          else
            quoted=$(printf '"%s",' "${stacks[@]}")
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "stacks=[${quoted%,}]" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan
    needs: changes
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.changes.outputs.stacks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=config/dev/config.remote
        working-directory: infra/${{ matrix.stack }}

      - name: Terraform Plan
        id: plan
        working-directory: infra/${{ matrix.stack }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          PLAN_ARGS=(-var-file=config/dev/config.tfvars -no-color -input=false)
          if [ "${{ matrix.stack }}" = "serverless" ]; then
            PLAN_ARGS+=(-var=image_tag=pr-${{ github.event.pull_request.number }})
          fi
          # No master secret here. Skip refresh so the provider does not connect.
          if [ "${{ matrix.stack }}" = "db" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            PLAN_ARGS+=(-refresh=false)
          fi
          if [ "${{ matrix.stack }}" = "portal" ]; then
            export TF_VAR_cloudflare_api_token="$CLOUDFLARE_API_TOKEN"
            export TF_VAR_cloudflare_account_id="$CLOUDFLARE_ACCOUNT_ID"
          fi
          terraform plan "${PLAN_ARGS[@]}" -lock=false -detailed-exitcode 2>&1 | tee plan-output.txt
          EXIT=${PIPESTATUS[0]}
          echo "exitcode=$EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-tfplan-${{ matrix.stack }}-${{ github.event.pull_request.number }}
          path: infra/${{ matrix.stack }}/plan-output.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACK: ${{ matrix.stack }}
          WORKING_DIR: infra/${{ matrix.stack }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.WORKING_DIR}/plan-output.txt`;
            let body = `_No plan output produced._`;
            if (fs.existsSync(path)) {
              let output = fs.readFileSync(path, 'utf8');
              if (output.length > 60000) {
                output = output.slice(0, 60000) + '\n\n… truncated …';
              }
              body = output;
            }
            const exit = process.env.PLAN_EXIT || '1';
            const status =
              exit === '0' ? 'No changes' :
              exit === '2' ? 'Changes detected' :
              'Failed';
            const marker = `<!-- tf-plan:${process.env.STACK} -->`;
            const comment = [
              marker,
              `### Terraform plan (\`dev\` / \`${process.env.STACK}\`)`,
              '',
              `**Status:** ${status} (exit ${exit})`,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```text',
              body,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

            if (exit !== '0' && exit !== '2') {
              core.setFailed(`Terraform plan failed for ${process.env.STACK}`);
            }

      - name: Fail job on plan error
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: exit 1
