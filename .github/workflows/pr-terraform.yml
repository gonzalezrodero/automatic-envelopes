name: "PR Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/bootstrap/**"
      - "infra/network/**"
      - "infra/db/**"
      - "infra/serverless/**"
      - "infra/portal/**"
      - ".github/workflows/pr-terraform.yml"
      - ".github/workflows/reusable-portal.yml"
      - ".github/workflows/reusable-terraform.yml"
      - ".github/workflows/reusable-serverless.yml"

# Same-repo PRs only (OIDC + secrets). Forks are skipped.
permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.11.4"
  ECR_REPOSITORY: automatic-envelopes-api

jobs:
  changes:
    name: Detect stacks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            bootstrap:
              - 'infra/bootstrap/**'
            network:
              - 'infra/network/**'
            db:
              - 'infra/db/**'
            serverless:
              - 'infra/serverless/**'
            portal:
              - 'infra/portal/**'

      # Build matrix in the changes job — job-level `if:` cannot reference matrix.
      - name: Build plan matrix
        id: matrix
        run: |
          items=()
          if [ "${{ steps.filter.outputs.bootstrap }}" = "true" ]; then
            items+=('{"stack":"bootstrap","working_dir":"infra/bootstrap"}')
          fi
          if [ "${{ steps.filter.outputs.network }}" = "true" ]; then
            items+=('{"stack":"network","working_dir":"infra/network"}')
          fi
          if [ "${{ steps.filter.outputs.db }}" = "true" ]; then
            items+=('{"stack":"db","working_dir":"infra/db"}')
          fi
          if [ "${{ steps.filter.outputs.serverless }}" = "true" ]; then
            items+=('{"stack":"serverless","working_dir":"infra/serverless"}')
          fi
          if [ "${{ steps.filter.outputs.portal }}" = "true" ]; then
            items+=('{"stack":"portal","working_dir":"infra/portal"}')
          fi
          if [ ${#items[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${items[*]}")
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: "Plan ${{ matrix.stack }}"
    needs: changes
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=config/dev/config.remote
        working-directory: ${{ matrix.working_dir }}

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.working_dir }}
        run: |
          set +e
          PLAN_ARGS=(-var-file=config/dev/config.tfvars -no-color -input=false)
          if [ "${{ matrix.stack }}" = "serverless" ]; then
            PLAN_ARGS+=(-var=image_tag=pr-${{ github.event.pull_request.number }})
          fi
          if [ "${{ matrix.stack }}" = "portal" ]; then
            export TF_VAR_cloudflare_api_token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
            export TF_VAR_cloudflare_account_id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          fi
          terraform plan "${PLAN_ARGS[@]}" -detailed-exitcode 2>&1 | tee plan-output.txt
          EXIT=${PIPESTATUS[0]}
          echo "exitcode=$EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-tfplan-${{ matrix.stack }}-${{ github.event.pull_request.number }}
          path: ${{ matrix.working_dir }}/plan-output.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STACK: ${{ matrix.stack }}
          WORKING_DIR: ${{ matrix.working_dir }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.WORKING_DIR}/plan-output.txt`;
            let body = `_No plan output produced._`;
            if (fs.existsSync(path)) {
              let output = fs.readFileSync(path, 'utf8');
              if (output.length > 60000) {
                output = output.slice(0, 60000) + '\n\n… truncated …';
              }
              body = output;
            }
            const exit = process.env.PLAN_EXIT || '1';
            const status =
              exit === '0' ? 'No changes' :
              exit === '2' ? 'Changes detected' :
              'Failed';
            const marker = `<!-- tf-plan:${process.env.STACK} -->`;
            const comment = [
              marker,
              `### Terraform plan (\`dev\` / \`${process.env.STACK}\`)`,
              '',
              `**Status:** ${status} (exit ${exit})`,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```text',
              body,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

            if (exit !== '0' && exit !== '2') {
              core.setFailed(`Terraform plan failed for ${process.env.STACK}`);
            }

      - name: Fail job on plan error
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: exit 1
