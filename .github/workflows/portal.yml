name: "CI/CD: Portal"

on:
  push:
    branches:
      - main
    paths:
      - "infra/portal/**"
      - ".github/workflows/portal.yml"
      - ".github/workflows/reusable-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-portal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.11.4"

jobs:
  deploy-dev:
    name: "development"
    uses: ./.github/workflows/reusable-portal.yml
    with:
      env_name: development
      tf_folder: dev
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-prod:
    name: "production"
    needs: deploy-dev
    uses: ./.github/workflows/reusable-portal.yml
    with:
      env_name: production
      tf_folder: prod
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
