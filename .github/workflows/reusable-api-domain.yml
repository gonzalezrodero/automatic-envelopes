name: "Template: Production API domain"

on:
  workflow_call:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.11.4"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=config/prod/config.remote
        working-directory: infra/api-dns

      - name: Terraform Plan
        run: terraform plan -var-file=config/prod/config.tfvars -no-color -input=false
        working-directory: infra/api-dns

  approve:
    name: Approve
    needs: plan
    uses: ./.github/workflows/reusable-approve.yml
    with:
      env_name: production
    permissions:
      contents: read

  apply-zone:
    name: Create zone
    needs: approve
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      name_servers: ${{ steps.servers.outputs.name_servers }}
      ses_dkim_tokens: ${{ steps.dkim.outputs.ses_dkim_tokens }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=config/prod/config.remote
        working-directory: infra/api-dns

      # The certificate cannot validate until the parent zone delegates here.
      # Create only the zone first so development can publish that delegation.
      - name: Terraform Apply zone
        run: |
          terraform apply -auto-approve -no-color -input=false \
            -var-file=config/prod/config.tfvars \
            -target=aws_route53_zone.api
        working-directory: infra/api-dns

      - id: servers
        name: Read name servers
        run: echo "name_servers=$(terraform output -json name_servers | jq -c .)" >> "$GITHUB_OUTPUT"
        working-directory: infra/api-dns

      # Same production role. A missing output or a list that is not three tokens
      # becomes [] so delegation writes no CNAMEs and still publishes the NS records.
      - id: dkim
        name: Read production DKIM tokens
        run: |
          set -euo pipefail
          tokens='[]'
          if terraform init -backend-config=config/prod/config.remote -input=false; then
            if raw=$(terraform output -json ses_dkim_tokens 2>/dev/null); then
              parsed=$(printf '%s' "$raw" | jq -c 'if type == "array" then . else [] end' || true)
              if [ -n "$parsed" ]; then
                tokens=$parsed
              fi
            else
              echo "Production DKIM output is not available yet; publishing no CNAMEs."
            fi
          else
            echo "Production serverless state is not readable yet; publishing no DKIM CNAMEs."
          fi
          echo "ses_dkim_tokens=$tokens" >> "$GITHUB_OUTPUT"
        working-directory: infra/serverless

  delegate:
    name: Delegate
    needs: apply-zone
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=config/dev/config.remote
        working-directory: infra/api-delegation

      - name: Terraform Apply delegation
        env:
          TF_VAR_name_servers: ${{ needs.apply-zone.outputs.name_servers }}
          TF_VAR_ses_dkim_tokens: ${{ needs.apply-zone.outputs.ses_dkim_tokens }}
        run: terraform apply -auto-approve -no-color -input=false -var-file=config/dev/config.tfvars
        working-directory: infra/api-delegation

  apply:
    name: Apply
    needs: delegate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=config/prod/config.remote
        working-directory: infra/api-dns

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color -input=false -var-file=config/prod/config.tfvars
        working-directory: infra/api-dns
