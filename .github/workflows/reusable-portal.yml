name: "Template: Terraform Plan & Apply Portal"

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      tf_folder:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.11.4"
  TF_WORKING_DIR: infra/portal

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-infra/portal-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform Init
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: terraform init -backend-config=config/$TF_FOLDER/config.remote
        working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Terraform Plan
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform plan \
            -var-file=config/$TF_FOLDER/config.tfvars \
            -out=tfplan \
            -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Upload Terraform plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-portal-${{ inputs.tf_folder }}-${{ inputs.env_name }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 5

  approve:
    name: Approve
    needs: plan
    uses: ./.github/workflows/reusable-approve.yml
    with:
      env_name: ${{ inputs.env_name }}
    permissions:
      contents: read
    concurrency:
      group: tf-infra/portal-${{ inputs.env_name }}
      cancel-in-progress: false

  apply:
    name: Apply
    needs: approve
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    concurrency:
      group: tf-infra/portal-${{ inputs.env_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Download Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-portal-${{ inputs.tf_folder }}-${{ inputs.env_name }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}
      - name: Terraform Init
        env:
          TF_FOLDER: ${{ inputs.tf_folder }}
        run: terraform init -backend-config=config/$TF_FOLDER/config.remote
        working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Terraform Apply
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform apply -auto-approve -no-color tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          project=$(terraform output -raw pages_project_name)
          curl -fsS -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "branch=main" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/deployments" \
            | jq -e '.success'
        working-directory: ${{ env.TF_WORKING_DIR }}
