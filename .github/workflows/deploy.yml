name: "CI/CD: API"
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'infra/serverless/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/reusable-serverless.yml'
  workflow_dispatch:

concurrency:
  group: deploy-serverless-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/AutomaticEnvelopes.Api/AutomaticEnvelopes.Api.csproj
      - run: dotnet build src/AutomaticEnvelopes.Api/AutomaticEnvelopes.Api.csproj --no-restore --configuration Release
      - run: dotnet test tests/AutomaticEnvelopes.Tests/AutomaticEnvelopes.Tests.csproj --no-build --configuration Release

  deploy-dev:
    name: development
    needs: build-and-test
    uses: ./.github/workflows/reusable-serverless.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: development
      tf_folder: dev
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy-prod:
    name: production
    needs: deploy-dev
    uses: ./.github/workflows/reusable-serverless.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: production
      tf_folder: prod
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
