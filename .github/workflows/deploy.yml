name: "CI/CD: API"
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'infra/serverless/**'
      - 'infra/modules/**'
      - 'infra/api-dns/**'
      - 'infra/api-delegation/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/reusable-serverless.yml'
      - '.github/workflows/reusable-api-domain.yml'
  workflow_dispatch:

concurrency:
  group: deploy-serverless-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/AutomaticEnvelopes.Api/AutomaticEnvelopes.Api.csproj
      - run: dotnet build src/AutomaticEnvelopes.Api/AutomaticEnvelopes.Api.csproj --no-restore --configuration Release
      - run: dotnet test --project tests/AutomaticEnvelopes.Tests/AutomaticEnvelopes.Tests.csproj --configuration Release

  deploy-dev:
    name: development
    needs: build-and-test
    uses: ./.github/workflows/reusable-serverless.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: development
      tf_folder: dev
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy-prod:
    name: production
    needs: deploy-dev
    uses: ./.github/workflows/reusable-serverless.yml
    permissions:
      id-token: write
      contents: read
    with:
      env_name: production
      tf_folder: prod
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # After production serverless, so api-delegation can read that apply's DKIM tokens.
  deploy-api-domain:
    name: production API domain
    needs: deploy-prod
    uses: ./.github/workflows/reusable-api-domain.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
