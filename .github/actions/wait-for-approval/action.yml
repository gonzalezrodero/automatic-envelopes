name: Wait for approval
description: Pause until the environment apply gate is approved, on the same runner.

inputs:
  env_name:
    description: development or production
    required: true
  github_token:
    description: Token used to open and watch the approval run
    required: true
  session_started:
    description: Unix time when the AWS session was created
    required: true

runs:
  using: composite
  steps:
    - name: Wait for approval
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ENV_NAME: ${{ inputs.env_name }}
        SESSION_STARTED: ${{ inputs.session_started }}
      run: |
        set -euo pipefail
        NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ENV_NAME}"
        TITLE="Approve ${ENV_NAME} ${NONCE}"
        gh workflow run manual-approval.yml \
          --ref "$GITHUB_REF_NAME" \
          -f "env_name=${ENV_NAME}" \
          -f "nonce=${NONCE}"

        RUN_ID=""
        for _ in $(seq 1 30); do
          sleep 2
          RUN_ID=$(gh run list \
            --workflow manual-approval.yml \
            --branch "$GITHUB_REF_NAME" \
            --limit 20 \
            --json databaseId,displayTitle \
            --jq "first(.[] | select(.displayTitle == \"${TITLE}\") | .databaseId) // empty")
          if [ -n "$RUN_ID" ]; then
            break
          fi
        done
        if [ -z "$RUN_ID" ]; then
          echo "Approval run did not start."
          exit 1
        fi

        URL=$(gh run view "$RUN_ID" --json url --jq .url)
        echo "Approve ${ENV_NAME}: ${URL}"

        APPROVED=0
        cleanup() {
          if [ "$APPROVED" != 1 ]; then
            gh run cancel "$RUN_ID" || true
          fi
        }
        trap cleanup EXIT

        while true; do
          age=$(( $(date +%s) - SESSION_STARTED ))
          if [ "$age" -gt 3300 ]; then
            echo "The AWS session reached 55 minutes. Re-run the workflow to log in again."
            exit 1
          fi
          state=$(gh run view "$RUN_ID" --json status,conclusion --jq '[.status, (.conclusion // "")] | join(" ")')
          echo "Approval status: ${state}"
          case "$state" in
            "completed success")
              APPROVED=1
              exit 0
              ;;
            completed*)
              echo "Approval was rejected."
              exit 1
              ;;
          esac
          sleep 15
        done
