version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: samabot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: samabot
    ports:
      - "5433:5432"
    volumes:
      - samabot_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  samabot_pg_data:
